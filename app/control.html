<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Control · Param OS</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0D0F14">
<link rel="manifest" href="/paramos/manifest.webmanifest">
<link rel="icon" href="/paramos/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#EEF0F4; --panel:#FFFFFF; --ink:#12151C; --mute:#5D6576; --line:#D5DAE3; --accent:#2B54F0;
  --ok:#1E9E5A; --warn:#D98A0B; --bad:#D6353F; --idle:#9AA2B1;
  --ok-bg:#E3F4EA; --warn-bg:#FBF0DC; --bad-bg:#FBE4E5; --idle-bg:#ECEEF2; --accent-bg:#E5EBFF; --field:#F6F7FA;
  --display:"Archivo","Arial Narrow",Arial,sans-serif; --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace; color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D0F14; --panel:#161A22; --ink:#E8EBF2; --mute:#8A93A6; --line:#262C38; --accent:#6F8CFF;
  --ok:#3CCB7F; --warn:#F2A93B; --bad:#FF5C66; --idle:#5E6678;
  --ok-bg:#12291D; --warn-bg:#2E2412; --bad-bg:#311518; --idle-bg:#1D222C; --accent-bg:#1A2346; --field:#0F1218; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
.wrap{max-width:920px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px 80px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--mono);font-size:12px;margin-bottom:18px}
.top a{color:var(--mute);text-decoration:none}.top a:hover{color:var(--ink)}
h1{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:clamp(30px,6vw,52px);letter-spacing:-.01em;line-height:.95;margin:0 0 10px;text-transform:uppercase}
.lede{color:var(--mute);margin:0 0 20px;max-width:62ch}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{font-family:var(--mono);font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 18px;overflow-x:auto}
.tab{font-family:var(--display);font-stretch:110%;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;background:none;border:0;border-bottom:3px solid transparent;color:var(--mute);padding:10px 14px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font-family:var(--mono);background:var(--idle-bg);color:var(--ink);border-radius:3px;padding:0 6px;margin-left:6px;letter-spacing:0}
.tab[aria-selected="true"] .n{background:var(--accent);color:#fff}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px}
.card h3{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.25;margin:0 0 8px;text-wrap:balance;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-family:var(--mono);font-size:11px;color:var(--mute);margin-bottom:10px}
.tag{border-radius:3px;padding:1px 7px;background:var(--idle-bg);color:var(--ink);white-space:nowrap}
.tag.ccd{background:var(--accent-bg);color:var(--accent)}.tag.mer{background:var(--ok-bg);color:var(--ok)}.tag.li{background:var(--warn-bg);color:var(--warn)}
.why{margin:0 0 14px;color:var(--ink)}
h5{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;margin:16px 0 6px}
.q{background:var(--accent-bg);border-left:3px solid var(--accent);border-radius:0 6px 6px 0;padding:10px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
details{margin-top:12px;border:1px solid var(--line);border-radius:8px;background:var(--field)}
details>summary{cursor:pointer;padding:9px 12px;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);list-style:none}
details>summary::before{content:"+ ";}details[open]>summary::before{content:"– "}
details>div{padding:0 14px 12px}
.src a{display:block;overflow-wrap:anywhere;font-size:13px}
textarea,input[type=text],input[type=url],select{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{min-height:110px;resize:vertical;line-height:1.5}
textarea:focus,input:focus,select:focus,button:focus-visible,.chip:focus-visible,.tab:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label{display:block;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;margin:14px 0 6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:640px){.row{grid-template-columns:1fr}}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
button.b{font:inherit;font-weight:600;font-size:14px;border-radius:8px;padding:9px 16px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button.b:hover{border-color:var(--ink)}
button.b.p{background:var(--accent);border-color:var(--accent);color:#fff}
button.b.g{background:var(--ok);border-color:var(--ok);color:#fff}
button.b.d{color:var(--bad)}
button.b[disabled]{opacity:.5;cursor:default}
.hint{font-family:var(--mono);font-size:11px;color:var(--mute)}
.status{display:inline-block;border-radius:3px;padding:1px 7px;font-family:var(--mono);font-size:11px}
.s-ok{background:var(--ok-bg);color:var(--ok)}.s-warn{background:var(--warn-bg);color:var(--warn)}.s-idle{background:var(--idle-bg);color:var(--mute)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:34px 20px;text-align:center;color:var(--mute)}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:14px;display:none}
.preview{max-width:160px;max-height:160px;border-radius:8px;margin-top:8px;border:1px solid var(--line);display:none}
.idea{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:18px}
.idea .row{grid-template-columns:200px 1fr}@media(max-width:640px){.idea .row{grid-template-columns:1fr}}
.rs h3{font-size:16px}.score{font-family:var(--mono);font-size:11px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.on{opacity:1}.toast.err{background:var(--bad);color:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="/paramos">← Param OS</a><span id="sync">Loading…</span></div>
  <h1>Control</h1>
  <p class="lede">Switch agents on and off, see what each last did, and watch Cats Can Dance live.</p>
  <div class="banner" id="banner" role="status"></div>
  <h5>Agents</h5><div id="agents"><div class="empty">Loading…</div></div>
  <h5 style="margin-top:28px">Cats Can Dance, live</h5><div id="ccd"><div class="empty">Loading…</div></div>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
const BASE = location.pathname.startsWith("/paramos") ? "/paramos/api/" : "/api/";
const $ = (s,r=document)=>r.querySelector(s);
const esc = (s)=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(m,err){const t=$("#toast");t.textContent=m;t.className="toast on"+(err?" err":"");clearTimeout(toast.t);toast.t=setTimeout(()=>t.className="toast",2600);}
const ago=(d)=>{ if(!d) return "never"; const t=new Date(d).getTime(); if(!t) return esc(d); const h=(Date.now()-t)/36e5; return h<1?"just now":h<24?Math.round(h)+"h ago":Math.round(h/24)+"d ago"; };
function cron(s){ if(!s||/demand/i.test(s)) return esc(s||"On demand"); const m=s.match(/(\d+) (\d+) \* \* (\S+)$/); if(!m) return esc(s);
  const D=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"]; const days=m[3]==="*"?"Daily":m[3].split(",").map(n=>D[+n]||n).join(", ");
  return `${days} at ${String(m[2]).padStart(2,"0")}:${String(m[1]).padStart(2,"0")} IST`; }
let AG=[];
async function loadAgents(){
  try{ const r=await fetch(BASE+"agents",{cache:"no-store"}); if(!r.ok) throw new Error(r.status); const j=await r.json(); AG=j.agents;
    $("#agents").innerHTML = AG.map(a=>`<div class="card" data-id="${esc(a.id)}"><div class="meta"><span class="tag">${esc(a.lane)}</span><span>${cron(a.schedule)}</span><span>${esc(a.model)}</span></div>
      <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><h3 style="margin:0">${esc(a.name)}</h3>
      <button class="b ${a.enabled?"g":""}" data-act="toggle" aria-pressed="${a.enabled}" style="min-width:92px">${a.enabled?"On":"Off"}</button></div>
      <p class="hint" style="margin:10px 0 0">${a.last?`Last run ${ago(a.last.date)}: ${esc(a.last.result)}. ${esc(String(a.last.summary).slice(0,200))}`:"No run recorded yet."}</p>
      ${a.enforced?"":`<p class="hint" style="margin:6px 0 0;color:var(--warn)">This agent does not read the switch yet. Turning it off here is recorded, but it will still run until its schedule is paused in Claude.</p>`}</div>`).join("");
  }catch(e){ $("#agents").innerHTML=`<div class="empty">Could not load agents (${esc(e.message)}).</div>`; }
}
async function loadCcd(){
  let h=""; 
  try{ const r=await fetch(BASE+"ccd-live",{cache:"no-store"}); const j=await r.json();
    h+=`<div class="card"><div class="meta"><a href="${esc(j.site)}" target="_blank" rel="noopener">${esc(j.site.replace("https://",""))}</a><span>checked ${ago(j.checked)}</span></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">${j.pages.map(p=>`<span class="status ${p.status===200?"s-ok":"s-warn"}">${esc(p.path)} ${p.status||"down"}</span>`).join("")}</div>
      ${j.staleDate?`<p class="why" style="margin-top:12px">The homepage still shows "Sun, Jun 28, 2026". It needs updating.</p>`:""}</div>`;
    h+=j.repos.map(rp=>`<div class="card"><div class="meta"><span class="tag ccd">GitHub</span><a href="https://github.com/${esc(rp.repo)}/tree/${esc(rp.branch)}" target="_blank" rel="noopener">${esc(rp.repo)} · ${esc(rp.branch)}</a></div>
      ${rp.error?`<p class="hint">${esc(rp.error)}</p>`:""}
      ${rp.prs.length?`<h5>Open pull requests</h5>${rp.prs.map(p=>`<p style="margin:0 0 4px"><a href="${esc(p.url)}" target="_blank" rel="noopener">#${p.n} ${esc(p.title)}</a></p>`).join("")}`:""}
      ${rp.commits.length?`<h5>Recent commits</h5>${rp.commits.map(c=>`<p style="margin:0 0 4px;font-size:13px"><span class="hint">${ago(c.date)}</span> <a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.msg)}</a></p>`).join("")}`:""}</div>`).join("");
  }catch(e){ h+=`<div class="empty">Could not check the live site (${esc(e.message)}).</div>`; }
  try{ const r=await fetch(BASE+"ccd",{cache:"no-store"}); const j=await r.json();
    if(j.status==="ok"){ h+=`<div class="card"><div class="meta"><span class="tag ccd">Supabase</span><span>updated ${ago(j.updated)}</span></div>${j.needs_you&&j.needs_you.length?`<h5>Needs you</h5>${j.needs_you.map(x=>`<p style="margin:0 0 4px">${esc(x)}</p>`).join("")}`:`<p class="why">Nothing waiting on you.</p>`}
      ${j.upcoming&&j.upcoming.length?`<h5>Upcoming events</h5>${j.upcoming.map(e=>`<p style="margin:0 0 4px">${esc(e.date)} · ${esc(e.title)}${e.venue?`, ${esc(e.venue)}`:""}</p>`).join("")}`:""}</div>`; }
  }catch(_){}
  $("#ccd").innerHTML=h||`<div class="empty">No data.</div>`;
}
document.addEventListener("click",async ev=>{
  const b=ev.target.closest('[data-act="toggle"]'); if(!b) return; const id=b.closest("[data-id]").dataset.id; const a=AG.find(x=>x.id===id); b.disabled=true;
  try{ const r=await fetch(BASE+"agents",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,enabled:!a.enabled})}); if(!r.ok) throw new Error(r.status); toast(a.name+(a.enabled?" switched off":" switched on")); await loadAgents(); }
  catch(e){ toast("Could not save: "+e.message,true); b.disabled=false; }
});
Promise.all([loadAgents(),loadCcd()]).then(()=>{$("#sync").textContent="Synced "+new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});});
</script>
</body>
</html>
