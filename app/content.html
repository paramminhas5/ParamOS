<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Content station · Param OS</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0D0F14">
<link rel="manifest" href="/paramos/manifest.webmanifest">
<link rel="icon" href="/paramos/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#EEF0F4; --panel:#FFFFFF; --ink:#12151C; --mute:#5D6576; --line:#D5DAE3; --accent:#2B54F0;
  --ok:#1E9E5A; --warn:#D98A0B; --bad:#D6353F; --idle:#9AA2B1;
  --ok-bg:#E3F4EA; --warn-bg:#FBF0DC; --bad-bg:#FBE4E5; --idle-bg:#ECEEF2; --accent-bg:#E5EBFF; --field:#F6F7FA;
  --display:"Archivo","Arial Narrow",Arial,sans-serif; --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace; color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D0F14; --panel:#161A22; --ink:#E8EBF2; --mute:#8A93A6; --line:#262C38; --accent:#6F8CFF;
  --ok:#3CCB7F; --warn:#F2A93B; --bad:#FF5C66; --idle:#5E6678;
  --ok-bg:#12291D; --warn-bg:#2E2412; --bad-bg:#311518; --idle-bg:#1D222C; --accent-bg:#1A2346; --field:#0F1218; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
.wrap{max-width:920px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px 80px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--mono);font-size:12px;margin-bottom:18px}
.top a{color:var(--mute);text-decoration:none}.top a:hover{color:var(--ink)}
h1{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:clamp(30px,6vw,52px);letter-spacing:-.01em;line-height:.95;margin:0 0 10px;text-transform:uppercase}
.lede{color:var(--mute);margin:0 0 20px;max-width:62ch}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{font-family:var(--mono);font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 18px;overflow-x:auto}
.tab{font-family:var(--display);font-stretch:110%;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;background:none;border:0;border-bottom:3px solid transparent;color:var(--mute);padding:10px 14px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font-family:var(--mono);background:var(--idle-bg);color:var(--ink);border-radius:3px;padding:0 6px;margin-left:6px;letter-spacing:0}
.tab[aria-selected="true"] .n{background:var(--accent);color:#fff}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px}
.card h3{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.25;margin:0 0 8px;text-wrap:balance;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-family:var(--mono);font-size:11px;color:var(--mute);margin-bottom:10px}
.tag{border-radius:3px;padding:1px 7px;background:var(--idle-bg);color:var(--ink);white-space:nowrap}
.tag.ccd{background:var(--accent-bg);color:var(--accent)}.tag.mer{background:var(--ok-bg);color:var(--ok)}.tag.li{background:var(--warn-bg);color:var(--warn)}
.why{margin:0 0 14px;color:var(--ink)}
h5{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;margin:16px 0 6px}
.q{background:var(--accent-bg);border-left:3px solid var(--accent);border-radius:0 6px 6px 0;padding:10px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
details{margin-top:12px;border:1px solid var(--line);border-radius:8px;background:var(--field)}
details>summary{cursor:pointer;padding:9px 12px;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);list-style:none}
details>summary::before{content:"+ ";}details[open]>summary::before{content:"– "}
details>div{padding:0 14px 12px}
.src a{display:block;overflow-wrap:anywhere;font-size:13px}
textarea,input[type=text],input[type=url],select{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{min-height:110px;resize:vertical;line-height:1.5}
textarea:focus,input:focus,select:focus,button:focus-visible,.chip:focus-visible,.tab:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label{display:block;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;margin:14px 0 6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:640px){.row{grid-template-columns:1fr}}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
button.b{font:inherit;font-weight:600;font-size:14px;border-radius:8px;padding:9px 16px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button.b:hover{border-color:var(--ink)}
button.b.p{background:var(--accent);border-color:var(--accent);color:#fff}
button.b.g{background:var(--ok);border-color:var(--ok);color:#fff}
button.b.d{color:var(--bad)}
button.b[disabled]{opacity:.5;cursor:default}
.hint{font-family:var(--mono);font-size:11px;color:var(--mute)}
.status{display:inline-block;border-radius:3px;padding:1px 7px;font-family:var(--mono);font-size:11px}
.s-ok{background:var(--ok-bg);color:var(--ok)}.s-warn{background:var(--warn-bg);color:var(--warn)}.s-idle{background:var(--idle-bg);color:var(--mute)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:34px 20px;text-align:center;color:var(--mute)}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:14px;display:none}
.preview{max-width:160px;max-height:160px;border-radius:8px;margin-top:8px;border:1px solid var(--line);display:none}
.idea{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:18px}
.idea .row{grid-template-columns:200px 1fr}@media(max-width:640px){.idea .row{grid-template-columns:1fr}}
.rs h3{font-size:16px}.score{font-family:var(--mono);font-size:11px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.on{opacity:1}.toast.err{background:var(--bad);color:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="/paramos">← Param OS</a><span id="sync">Loading…</span></div>
  <h1>Content station</h1>
  <p class="lede">Research first, then your take, then the draft. Nothing posts until you approve it and name the account. Everything lives in Airtable.</p>
  <div class="banner" id="banner" role="status"></div>
  <div class="bar" id="channels" role="group" aria-label="Channel"></div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div id="view" aria-live="polite"></div>
</div>
<div class="toast" id="toast" role="status"></div>
<datalist id="accounts"><option value="Cats Can Dance"><option value="Dryp"></datalist>
<script>
const API = location.pathname.startsWith("/paramos") ? "/paramos/api/content" : "/api/content";
const CH = [["all","All"],["CCD Instagram","Cats Can Dance"],["Merman Instagram","Merman"],["LinkedIn","LinkedIn"]];
const RCH = { "CCD Instagram":"CCD", "Merman Instagram":"Merman", "LinkedIn":"LinkedIn" };
let D = null, tab = "need", chan = "all";
const $ = (s, r=document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const urls = (s) => String(s||"").split(/\s+/).filter(x => /^https?:\/\//.test(x));
const tagCls = (c) => c==="CCD Instagram"?"ccd":c==="Merman Instagram"?"mer":"li";
const SCHED = { "CCD Instagram":{days:[0,1,2,3,4,5,6],h:11,m:8}, "Merman Instagram":{days:[2,5],h:11,m:18}, "LinkedIn":{days:[1,4],h:11,m:28} };
function nextRun(ch){
  const s = SCHED[ch]; if(!s) return "";
  const ist = new Date(Date.now()+5.5*3600e3);
  for(let i=0;i<8;i++){
    const d = new Date(Date.UTC(ist.getUTCFullYear(),ist.getUTCMonth(),ist.getUTCDate()+i,s.h,s.m));
    if(s.days.includes(d.getUTCDay()) && d.getTime() > ist.getTime()){
      return d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",timeZone:"UTC"})+", "+String(s.h)+":"+String(s.m).padStart(2,"0")+" IST";
    }
  }
  return "";
}
function toast(msg, err){ const t=$("#toast"); t.textContent=msg; t.className="toast on"+(err?" err":""); clearTimeout(toast.t); toast.t=setTimeout(()=>t.className="toast",2600); }
function banner(msg){ const b=$("#banner"); b.style.display=msg?"block":"none"; b.textContent=msg||""; }

async function load(){
  try{
    const r = await fetch(API,{cache:"no-store"});
    if(r.status===401) { location.reload(); return; }
    if(!r.ok) throw new Error(r.status);
    D = await r.json(); banner("");
    try{ localStorage.setItem("paramos:content", JSON.stringify(D)); }catch(_){}
    $("#sync").textContent = "Synced " + new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
  }catch(e){
    try{ D = JSON.parse(localStorage.getItem("paramos:content")); }catch(_){}
    banner(D ? "Offline or unreachable, showing the last saved copy. Changes will not save." : "Could not load. Check your connection and reload.");
    $("#sync").textContent = "Offline";
  }
  render();
}
async function post(body){
  const r = await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||r.status);
  return j;
}
const ERR = { needs_image_and_account:"Instagram posts need an image link and an account name before approval.", needs_draft:"There is no draft yet.", bad_status:"That status is not allowed." };

function groups(){
  const c = (D?.content||[]).filter(x => chan==="all" || x.channel===chan);
  const inCh = (r) => chan==="all" || RCH[chan]===r.channel;
  return {
    need: c.filter(x => (x.status==="Needs approval") || (x.status==="Needs your notes" && !String(x.notes).trim())),
    agent: c.filter(x => x.status==="Drafted" || (x.status==="Needs your notes" && String(x.notes).trim()) || x.status==="Idea"),
    approved: c.filter(x => x.status==="Approved"),
    research: (D?.research||[]).filter(inCh),
    done: c.filter(x => x.status==="Posted" || x.status==="Skipped").reverse(),
  };
}
const TABS = [["need","Needs you"],["agent","With the agent"],["approved","Approved"],["research","Research inbox"],["done","Done"]];

function render(){
  $("#channels").innerHTML = CH.map(([v,l]) => `<button class="chip" data-ch="${esc(v)}" aria-pressed="${chan===v}">${esc(l)}</button>`).join("");
  const g = groups();
  $("#tabs").innerHTML = TABS.map(([k,l]) => `<button class="tab" role="tab" data-tab="${k}" aria-selected="${tab===k}">${l}<span class="n">${g[k].length}</span></button>`).join("");
  const v = $("#view");
  if(!D){ v.innerHTML = `<div class="empty">Loading…</div>`; return; }
  if(tab==="research") { v.innerHTML = ideaBox() + (g.research.length ? g.research.map(researchCard).join("") : `<div class="empty">Nothing waiting. The daily scan runs at 07:45 IST.</div>`); return; }
  const list = g[tab];
  v.innerHTML = list.length ? list.map(card).join("") : `<div class="empty">${{
    need:"Nothing needs you right now. The agents research daily and will leave questions here.",
    agent:"Nothing is waiting on an agent.", approved:"Nothing approved and waiting to post.", done:"Nothing posted yet."}[tab]}</div>`;
}

function ideaBox(){
  return `<form class="idea" id="idea"><label for="ideaCh" style="margin-top:0">Add your own idea</label>
    <div class="row"><select id="ideaCh"><option value="CCD">Cats Can Dance</option><option value="Merman">Merman</option><option value="LinkedIn">LinkedIn</option></select>
    <input type="text" id="ideaText" placeholder="A story, a label, an artist, something that happened. The agent researches it first." maxlength="300" required></div>
    <div class="actions"><button class="b p" type="submit">Send to the agent</button><span class="hint">Your ideas go to the top of its list.</span></div></form>`;
}
function researchCard(r){
  const mine = r.source==="Param";
  return `<div class="card rs" data-id="${esc(r.id)}"><div class="meta"><span class="tag ${r.channel==="CCD"?"ccd":r.channel==="Merman"?"mer":"li"}">${esc(r.channel)}</span><span>${esc(r.source)}</span>${r.pub?`<span>${esc(r.pub)}</span>`:""}<span class="score">score ${esc(r.score)}</span></div>
    <h3>${esc(r.item)}</h3>${r.summary?`<p class="why">${esc(String(r.summary).slice(0,320))}${String(r.summary).length>320?"…":""}</p>`:""}
    <div class="actions" style="margin-top:8px">${r.url?`<a class="b" style="text-decoration:none;display:inline-block" href="${esc(r.url)}" target="_blank" rel="noopener">Open source</a>`:""}
    ${r.score>=90||mine?`<span class="status s-ok">Prioritised</span>`:`<button class="b p" data-act="pick">Prioritise</button>`}<button class="b d" data-act="drop">Drop</button></div></div>`;
}

function card(x){
  const needNotes = x.status==="Needs your notes";
  const needApp = x.status==="Needs approval";
  const ig = /Instagram/.test(x.channel);
  const draft = x.edit || x.draft;
  const stCls = x.status==="Posted"||x.status==="Approved"?"s-ok":x.status==="Skipped"?"s-idle":"s-warn";
  let h = `<article class="card" data-id="${esc(x.id)}" data-ch="${esc(x.channel)}"><div class="meta"><span class="tag ${tagCls(x.channel)}">${esc(x.channel)}</span><span class="tag">${esc(x.format)}</span><span class="status ${stCls}">${esc(x.status)}</span>${x.postOn?`<span>post on ${esc(x.postOn)}</span>`:""}</div>
  <h3>${esc(x.piece)}</h3>${x.why?`<p class="why">${esc(x.why)}</p>`:""}`;
  if(x.questions && (needNotes||needApp||x.status==="Drafted")) h += `<h5>Questions for you</h5><div class="q">${esc(x.questions)}</div>`;
  if(x.research) h += `<details><summary>Research</summary><div><p class="pre">${esc(x.research)}</p></div></details>`;
  if(x.sources) h += `<details><summary>Sources</summary><div class="src">${urls(x.sources).map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("") || `<p class="pre">${esc(x.sources)}</p>`}</div></details>`;
  if(needNotes || needApp || x.status==="Drafted" || x.status==="Approved"){
    const editable = x.status!=="Approved";
    h += `<label for="n-${esc(x.id)}">Your notes, take and details</label><textarea id="n-${esc(x.id)}" data-f="notes" ${editable?"":"readonly"} placeholder="What do you actually think? What did you feel, see, know that the research does not say?">${esc(x.notes)}</textarea>`;
  }
  if(draft){
    h += `<label for="e-${esc(x.id)}">${needApp||x.status==="Drafted"?"Draft (edit freely, your edits teach the agent)":"Final text"}</label><textarea id="e-${esc(x.id)}" data-f="edit" data-orig="${esc(x.draft)}" style="min-height:170px" ${x.status==="Approved"||x.status==="Posted"?"readonly":""}>${esc(draft)}</textarea>`;
  }
  if(ig && (needApp || x.status==="Approved" || x.status==="Drafted")){
    h += `<div class="row"><div><label for="i-${esc(x.id)}">Image link (public https)</label><input type="url" id="i-${esc(x.id)}" data-f="image" value="${esc(x.image)}" placeholder="https://…" ${x.status==="Approved"?"readonly":""}></div>
    <div><label for="a-${esc(x.id)}">Post from account</label><input type="text" id="a-${esc(x.id)}" data-f="account" list="accounts" value="${esc(x.account)}" placeholder="e.g. Cats Can Dance" ${x.status==="Approved"?"readonly":""}></div></div><img class="preview" alt="Image preview">`;
  }
  if(!ig && needApp) h += "";
  if(x.status==="Posted" && x.posted) h += `<p><a href="${esc(x.posted)}" target="_blank" rel="noopener">View the post</a></p>`;
  if(x.learned) h += `<h5>What the agent learned</h5><p class="pre">${esc(x.learned)}</p>`;
  // actions
  const a = [];
  if(needNotes) a.push(`<button class="b p" data-act="save">Save notes</button>`, `<span class="hint">The agent drafts at its next run${nextRun(x.channel)?`: ${esc(nextRun(x.channel))}`:""}.</span>`);
  if(needApp) a.push(`<button class="b g" data-act="approve">Approve</button>`, `<button class="b" data-act="save">Save</button>`, `<button class="b" data-act="redraft">Ask for a redraft</button>`);
  if(x.status==="Drafted") a.push(`<button class="b" data-act="save">Save</button>`, `<span class="hint">Redraft at ${esc(nextRun(x.channel))}</span>`);
  if(x.status==="Approved") a.push(`<span class="hint">Posts at the agent's next run: ${esc(nextRun(x.channel))}</span>`, `<button class="b" data-act="unapprove">Take back</button>`);
  if(needNotes||needApp||x.status==="Drafted") a.push(`<button class="b d" data-act="skip">Skip</button>`);
  if(a.length) h += `<div class="actions">${a.join("")}</div>`;
  return h + `</article>`;
}

function collect(art){
  const f = {};
  const n = $('[data-f="notes"]',art); if(n && !n.readOnly) f.notes = n.value;
  const e = $('[data-f="edit"]',art); if(e && !e.readOnly) f.edit = (e.value.trim()===(e.dataset.orig||"").trim()) ? "" : e.value;
  const i = $('[data-f="image"]',art); if(i && !i.readOnly) f.image = i.value.trim();
  const a = $('[data-f="account"]',art); if(a && !a.readOnly) f.account = a.value.trim();
  return f;
}

document.addEventListener("click", async (ev) => {
  const chip = ev.target.closest("[data-ch]"); if(chip && chip.classList.contains("chip")){ chan = chip.dataset.ch; render(); return; }
  const tb = ev.target.closest("[data-tab]"); if(tb){ tab = tb.dataset.tab; render(); return; }
  const btn = ev.target.closest("[data-act]"); if(!btn) return;
  const art = btn.closest("[data-id]"); const id = art.dataset.id; const act = btn.dataset.act;
  if(act==="skip" && btn.dataset.sure!=="1"){ btn.dataset.sure="1"; btn.textContent="Confirm skip"; setTimeout(()=>{ if(btn.isConnected){btn.dataset.sure="";btn.textContent="Skip";} },3500); return; }
  btn.disabled = true;
  try{
    if(act==="pick"||act==="drop"){ await post({action:act,id}); toast(act==="pick"?"Prioritised":"Dropped"); }
    else {
      const fields = collect(art);
      if(act==="save") { await post({action:"save",id,fields}); toast("Saved"); }
      else if(act==="approve") { await post({action:"status",id,status:"Approved",fields}); toast("Approved. It posts at the agent's next run."); }
      else if(act==="redraft") { await post({action:"status",id,status:"Drafted",fields}); toast("Redraft requested"); }
      else if(act==="unapprove") { await post({action:"status",id,status:"Needs approval"}); toast("Taken back"); }
      else if(act==="skip") { await post({action:"status",id,status:"Skipped"}); toast("Skipped"); }
    }
    await load();
  }catch(e){ toast(ERR[e.message]||("Could not save: "+e.message), true); btn.disabled=false; }
});
document.addEventListener("submit", async (ev) => {
  if(ev.target.id!=="idea") return; ev.preventDefault();
  const text = $("#ideaText").value.trim(); if(!text) return;
  try{ await post({action:"idea",channel:$("#ideaCh").value,text}); toast("Sent. The agent picks it up first."); await load(); }
  catch(e){ toast("Could not send: "+e.message, true); }
});
document.addEventListener("input", (ev) => {
  if(ev.target.matches('[data-f="image"]')){
    const img = ev.target.closest("article").querySelector(".preview"); const u = ev.target.value.trim();
    if(/^https:\/\//.test(u)){ img.src=u; img.style.display="block"; } else img.style.display="none";
  }
});
load();
</script>
</body>
</html>
